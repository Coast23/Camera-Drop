name: Build & Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release'
        type: boolean
        default: false
        required: false
      version:
        description: 'Release version tag (e.g. v1.2.0), required when publishing'
        type: string
        default: ''
        required: false
      release_name:
        description: 'Release title (defaults to version tag)'
        type: string
        default: ''
        required: false

permissions:
  contents: write

env:
  OPENCV_VERSION: '4.10.0'
  ORT_VERSION:    '1.20.1'

jobs:
  # ── Windows / MSVC ──────────────────────────────────────────────
  build-windows:
    name: Build encoder & decoder (Windows / MSVC)
    runs-on: windows-latest

    steps:
      # ── 发布前校验 ──────────────────────────────────────────────
      - name: Validate release inputs
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        shell: pwsh
        run: |
          if (-not '${{ inputs.version }}') {
            Write-Error 'version is required when publish_release is true'
            exit 1
          }

      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── FFmpeg ─────────────────────────────────────────────────
      - name: Download FFmpeg (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          $outDir    = Join-Path $env:GITHUB_WORKSPACE "third_party\ffmpeg"

          Write-Host "Downloading FFmpeg from $ffmpegUrl ..."
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile ffmpeg-win64.zip -UseBasicParsing

          Write-Host "Extracting ..."
          Expand-Archive ffmpeg-win64.zip -DestinationPath _ffmpeg_tmp -Force

          $innerDir = Get-ChildItem _ffmpeg_tmp -Directory | Select-Object -First 1

          New-Item -ItemType Directory -Force -Path "$outDir\bin" | Out-Null
          Copy-Item "$($innerDir.FullName)\bin\ffmpeg.exe"  "$outDir\bin\ffmpeg.exe"
          Copy-Item "$($innerDir.FullName)\bin\ffprobe.exe" "$outDir\bin\ffprobe.exe"

          Write-Host "FFmpeg installed to $outDir\bin"
          Get-ChildItem "$outDir\bin"

      # ── OpenCV ──────────────────────────────────────────────────
      - name: Cache OpenCV
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: C:\opencv
          key: opencv-${{ env.OPENCV_VERSION }}-vc17-x64

      - name: Download & extract OpenCV
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/opencv/opencv/releases/download/${{ env.OPENCV_VERSION }}/opencv-${{ env.OPENCV_VERSION }}-windows.exe"
          Invoke-WebRequest -Uri $url -OutFile opencv-installer.exe -UseBasicParsing
          & "C:\Program Files\7-Zip\7z.exe" x opencv-installer.exe -oC:\ -y | Out-Null

      # ── ONNX Runtime ────────────────────────────────────────────
      - name: Cache ONNX Runtime
        id: cache-ort
        uses: actions/cache@v4
        with:
          path: C:\onnxruntime
          key: onnxruntime-${{ env.ORT_VERSION }}-win-x64

      - name: Download & extract ONNX Runtime
        if: steps.cache-ort.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $pkg = "onnxruntime-win-x64-${{ env.ORT_VERSION }}"
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v${{ env.ORT_VERSION }}/$pkg.zip"
          Invoke-WebRequest -Uri $url -OutFile ort.zip -UseBasicParsing
          Expand-Archive ort.zip -DestinationPath C:\
          Rename-Item "C:\$pkg" C:\onnxruntime

      # ── Build ───────────────────────────────────────────────────
      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DOpenCV_DIR="C:\opencv\build" `
            -DONNXRUNTIME_ROOT="C:\onnxruntime" `
            -DCAMDROP_FFMPEG_EXE="${{ github.workspace }}\third_party\ffmpeg\bin\ffmpeg.exe" `
            -DCAMDROP_RESOURCE_DIR="${{ github.workspace }}" `
            -DCAMDROP_BUILD_VISION=ON `
            -DCAMDROP_BUILD_ORT_PIPELINE=ON `
            -DCAMDROP_BUILD_MISC_TOOLS=OFF

      - name: Build encoder & decoder
        shell: pwsh
        run: |
          cmake --build build --config Release `
            --target file_video_encoder file_video_decoder `
            --parallel

      # ── 打包产物 ────────────────────────────────────────────────
      - name: Collect artifacts
        shell: pwsh
        run: |
          $dist = "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          Copy-Item "build\Release\file_video_encoder.exe" $dist
          Copy-Item "build\Release\file_video_decoder.exe" $dist

          # CMake POST_BUILD 已将 onnxruntime.dll 复制至此
          Get-ChildItem "build\Release" -Filter "*.dll" | ForEach-Object {
              Copy-Item $_.FullName $dist
              Write-Host "Bundled from build: $($_.Name)"
          }

          # 兜底：若 build\Release 中缺少 opencv_world*.dll，则递归搜索并补充
          if (-not (Get-ChildItem $dist -Filter "opencv_world*.dll")) {
              $ocvDll = Get-ChildItem "C:\opencv" -Filter "opencv_world*.dll" -Recurse |
                        Where-Object { $_.Name -notmatch 'd\.dll$' } |
                        Select-Object -First 1
              if (-not $ocvDll) { throw "OpenCV release DLL not found" }
              Copy-Item $ocvDll.FullName $dist
              Write-Host "Bundled OpenCV (fallback): $($ocvDll.Name)"
          }

          # FFmpeg: copy into same directory as binaries
          Get-ChildItem "third_party\ffmpeg\bin\*" | ForEach-Object {
              Copy-Item $_.FullName $dist
              Write-Host "Bundled FFmpeg: $($_.Name)"
          }

          foreach ($resourceDir in @("web", "cnn", "pattern_finder")) {
              $src = Join-Path "build\Release" $resourceDir
              if (Test-Path $src) {
                  Copy-Item $src $dist -Recurse
                  Write-Host "Bundled resources: $resourceDir"
              } else {
                  throw "Missing bundled resource directory: $src"
              }
          }

          Compress-Archive -Path "$dist\*" -DestinationPath camera-drop-tools-windows.zip
          Write-Host "Package contents:"
          Get-ChildItem $dist | Select-Object Name, Length

      - name: Smoke test packaged decoder (Windows)
        shell: pwsh
        run: |
          Push-Location dist
          try {
            $inputPath = Join-Path $env:RUNNER_TEMP "release_smoke_input.bin"
            $framesDir = Join-Path $env:RUNNER_TEMP "release_smoke_frames"
            $videoPath = Join-Path $env:RUNNER_TEMP "release_smoke.mp4"
            $outputPath = Join-Path $env:RUNNER_TEMP "release_smoke_output.bin"
            $inputBytes = [byte[]](0..255)
            [System.IO.File]::WriteAllBytes($inputPath, $inputBytes)
            if (Test-Path $framesDir) { Remove-Item $framesDir -Recurse -Force }

            & .\file_video_encoder.exe `
              --input $inputPath `
              --out-dir $framesDir `
              --video-out $videoPath `
              --fps 60 `
              --target-frames 1 `
              --limit-frames 1 `
              --threads 1
            if ($LASTEXITCODE -ne 0) {
              throw "packaged file_video_encoder smoke test failed with exit code $LASTEXITCODE"
            }

            & .\file_video_decoder.exe `
              --input $framesDir `
              --output $outputPath `
              --deskewed-input `
              --threads 1 `
              --ort-threads 1
            if ($LASTEXITCODE -ne 0) {
              throw "packaged file_video_decoder smoke test failed with exit code $LASTEXITCODE"
            }

            $decodedBytes = [System.IO.File]::ReadAllBytes($outputPath)
            if ($decodedBytes.Length -lt $inputBytes.Length) {
              throw "decoded output too short: $($decodedBytes.Length) < $($inputBytes.Length)"
            }
            for ($i = 0; $i -lt $inputBytes.Length; $i++) {
              if ($decodedBytes[$i] -ne $inputBytes[$i]) {
                throw "decoded bytes mismatch at offset $i"
              }
            }
          } finally {
            Pop-Location
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: camera-drop-tools-windows
          path: camera-drop-tools-windows.zip
          retention-days: 30

  # ── Linux / GCC ─────────────────────────────────────────────────
  build-linux:
    name: Build encoder & decoder (Linux / GCC)
    runs-on: ubuntu-latest

    steps:
      # ── 发布前校验 ──────────────────────────────────────────────
      - name: Validate release inputs
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        run: |
          if [ -z "${{ inputs.version }}" ]; then
            echo "::error::version is required when publish_release is true"
            exit 1
          fi

      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── FFmpeg ─────────────────────────────────────────────────
      - name: Download FFmpeg (Linux)
        run: |
          set -e
          url="https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"
          mkdir -p third_party/ffmpeg/bin
          curl -L "$url" -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          dir=$(find . -maxdepth 1 -type d -name "ffmpeg-*static" | head -n 1)
          cp "$dir/ffmpeg" third_party/ffmpeg/bin/ffmpeg
          chmod +x third_party/ffmpeg/bin/ffmpeg

      # ── OpenCV ──────────────────────────────────────────────────
      - name: Install OpenCV
        run: sudo apt-get update && sudo apt-get install -y libopencv-dev

      # ── ONNX Runtime ────────────────────────────────────────────
      - name: Cache ONNX Runtime
        id: cache-ort
        uses: actions/cache@v4
        with:
          path: /opt/onnxruntime
          key: onnxruntime-${{ env.ORT_VERSION }}-linux-x64

      - name: Download & extract ONNX Runtime
        if: steps.cache-ort.outputs.cache-hit != 'true'
        run: |
          pkg="onnxruntime-linux-x64-${{ env.ORT_VERSION }}"
          url="https://github.com/microsoft/onnxruntime/releases/download/v${{ env.ORT_VERSION }}/${pkg}.tgz"
          wget -q "$url" -O ort.tgz
          mkdir -p /opt/onnxruntime
          tar -xzf ort.tgz --strip-components=1 -C /opt/onnxruntime

      # ── Build ───────────────────────────────────────────────────
      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DONNXRUNTIME_ROOT=/opt/onnxruntime \
            -DCAMDROP_FFMPEG_EXE="${GITHUB_WORKSPACE}/third_party/ffmpeg/bin/ffmpeg" \
            -DCAMDROP_RESOURCE_DIR="${GITHUB_WORKSPACE}" \
            -DCAMDROP_BUILD_VISION=ON \
            -DCAMDROP_BUILD_ORT_PIPELINE=ON \
            -DCAMDROP_BUILD_MISC_TOOLS=OFF

      - name: Build encoder & decoder
        run: |
          cmake --build build \
            --target file_video_encoder file_video_decoder \
            --parallel

      # ── 打包产物 ────────────────────────────────────────────────
      - name: Collect artifacts
        run: |
          mkdir dist
          cp build/file_video_encoder dist/
          cp build/file_video_decoder dist/

          # ONNX Runtime 共享库（复制所有非符号链接的 .so 文件）
          find /opt/onnxruntime/lib -name "*.so*" ! -type l | while read f; do
            cp "$f" dist/
            echo "Bundled: $(basename $f)"
          done
          # FFmpeg: copy into same directory as binaries
          cp third_party/ffmpeg/bin/ffmpeg dist/
          chmod +x dist/ffmpeg

          for resource_dir in web cnn pattern_finder; do
            if [ ! -d "build/${resource_dir}" ]; then
              echo "::error::Missing bundled resource directory build/${resource_dir}"
              exit 1
            fi
            cp -r "build/${resource_dir}" "dist/${resource_dir}"
            echo "Bundled resources: ${resource_dir}"
          done

          echo "Package contents:"
          ls -lh dist/
          tar -czf camera-drop-tools-linux.tar.gz -C dist .

      - name: Smoke test packaged decoder (Linux)
        run: |
          set -e
          cd dist
          python3 - <<'PY'
          from pathlib import Path
          path = Path("release_smoke_input.bin")
          path.write_bytes(bytes(range(256)))
          PY
          rm -rf release_smoke_frames
          ./file_video_encoder \
            --input ./release_smoke_input.bin \
            --out-dir ./release_smoke_frames \
            --video-out ./release_smoke.mp4 \
            --fps 60 \
            --target-frames 1 \
            --limit-frames 1 \
            --threads 1
          ./file_video_decoder \
            --input ./release_smoke_frames \
            --output ./release_smoke.bin \
            --deskewed-input \
            --threads 1 \
            --ort-threads 1
          cmp -n 256 ./release_smoke_input.bin ./release_smoke.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: camera-drop-tools-linux
          path: camera-drop-tools-linux.tar.gz
          retention-days: 30

  # ── 发布至 Release（仅手动触发且勾选发布时执行）──────────────────
  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: camera-drop-tools-windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: camera-drop-tools-linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.release_name || inputs.version }}
          files: |
            camera-drop-tools-windows.zip
            camera-drop-tools-linux.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
