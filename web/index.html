<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Camera-Drop Scanner</title>
<!-- coi-serviceworker：为不支持 COOP/COEP 的环境注入跨域头，启用 ORT 多线程 -->
<script src="coi-serviceworker.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f0f0f;
    color: #e0e0e0;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-height: -webkit-fill-available;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: #1a1a1a;
    border-bottom: 1px solid #2a2a2a;
    flex-shrink: 0;
  }
  header h1 { font-size: 0.95rem; font-weight: 600; white-space: nowrap; }
  #statusBar {
    flex: 1;
    font-size: 0.7rem;
    color: #777;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: right;
  }
  #loadBtn {
    font-size: 0.75rem;
    padding: 5px 10px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    flex-shrink: 0;
    white-space: nowrap;
  }
  #loadBtn.ready  { background: #16a34a; }
  #loadBtn.loading { background: #9333ea; cursor: default; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 6px 6px 0 6px;
    padding-bottom: calc(6px + env(safe-area-inset-bottom, 12px));
    overflow: hidden;
  }

  .cam-wrap {
    position: relative;
    width: 100%;
    flex: 1;
    min-height: 0;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
  }
  #video {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  #overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  #perfBar {
    position: absolute;
    bottom: 6px; left: 50%;
    transform: translateX(-50%);
    font-size: 0.65rem;
    color: rgba(255,255,255,0.7);
    background: rgba(0,0,0,0.45);
    padding: 2px 10px;
    border-radius: 20px;
    pointer-events: none;
    white-space: nowrap;
  }
  #scanHint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  #scanHint span {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.5);
    background: rgba(0,0,0,0.5);
    padding: 6px 14px;
    border-radius: 20px;
  }
  #scanHint.hidden { display: none; }

  .results {
    flex: 1;
    min-height: 0;
  }
  .card {
    height: 100%;
    background: #1a1a1a;
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card-title {
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: .5px;
    text-transform: uppercase;
    color: #666;
    padding: 2px 7px;
    background: #222;
    flex-shrink: 0;
  }
  .card canvas {
    flex: 1;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: #111;
    padding: 3px;
    transition: opacity 0.5s;
  }
  #decodeBar {
    display: none;
    flex-shrink: 0;
    font-size: 0.66rem;
    color: #9ca3af;
    border-top: 1px solid #2a2a2a;
    background: #181818;
    padding: 5px 7px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #decodeBar.active { display: block; }
  #cameraMeta {
    flex-shrink: 0;
    min-height: 108px;
    max-height: 148px;
    overflow: auto;
    border-top: 1px solid #2a2a2a;
    background: #141414;
    color: #9ca3af;
    font: 11px/1.35 ui-monospace, SFMono-Regular, Consolas, monospace;
    padding: 6px 8px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* 初始化遮罩 */
  #initOverlay {
    position: fixed;
    inset: 0;
    background: #0f0f0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 200;
  }
  #initOverlay.hidden { display: none; }
  #initOverlay h2 { font-size: 1.1rem; }
  #initMsg { font-size: 0.8rem; color: #888; }
  .prog-wrap {
    width: 220px;
    height: 5px;
    background: #333;
    border-radius: 3px;
    overflow: hidden;
  }
  #progBar {
    height: 100%;
    background: #2563eb;
    width: 0%;
    transition: width .3s;
    border-radius: 3px;
  }
  #startBtn {
    padding: 10px 28px;
    background: #2563eb;
    border: none;
    color: #fff;
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
    display: none;
  }
  #startBtn:hover { background: #1d4ed8; }
  #startBtn:disabled { opacity: 0.55; cursor: not-allowed; }
</style>
</head>
<body>

<div id="initOverlay">
  <h2>📷 Camera-Drop Scanner</h2>
  <div id="initMsg">正在加载 OpenCV.js…</div>
  <div class="prog-wrap"><div id="progBar"></div></div>
  <button id="startBtn" onclick="onStart()" disabled>开始扫描</button>
</div>

<header>
  <h1>📷 Camera-Drop</h1>
  <span id="statusBar">初始化中…</span>
  <button id="loadBtn" onclick="pickModel()">加载模型</button>
</header>
<main>
  <div class="cam-wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="perfBar">—</div>
    <div id="scanHint"><span id="hintText">请加载 .onnx 模型</span></div>
  </div>
  <div class="results">
    <div class="card">
      <div class="card-title">
        Deskewed
        <button id="dlBtn" onclick="downloadDeskewed()" style="font-size:0.6rem;padding:1px 6px;background:#333;color:#aaa;border:1px solid #555;border-radius:4px;cursor:pointer;">保存</button>
      </div>
      <canvas id="deskewedCanvas"></canvas>
      <div id="decodeBar">等待识别…</div>
      <pre id="cameraMeta">&#x7B49;&#x5F85;&#x76F8;&#x673A;&#x4FE1;&#x606F;&#x2026;</pre>
    </div>
  </div>
</main>

<input type="file" id="filePicker" accept=".onnx" style="display:none">

<script src="ort.webgpu.min.js"></script>
<script src="js/ort-env-config.js"></script>
<script src="js/app-context.js?v=20260308d"></script>
<script src="js/app-cv.js?v=20260308c"></script>
<script src="opencv.js"></script>
<script src="js/cv-wait.js"></script>
<script src="js/app-camera.js?v=20260308d"></script>
<script src="js/app-worker.js?v=20260308c"></script>
<script src="js/app-localizer-cv.js?v=20260306w"></script>
<script src="js/app-patch.js?v=20260307a"></script>
<script src="js/app-deskew.js?v=20260308c"></script>
<script src="js/app-recognizer.js?v=20260307d"></script>
<script src="js/app-model.js?v=20260308d"></script>
</body>
</html>
